server {
    listen 80;
    server_name localhost;

    # Serve the static frontend.
    # Disable caching for HTML/JS so the portal always loads the latest code —
    # ngrok and browsers otherwise serve a stale app.js after every change.
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
        expires -1;
    }

    # Proxy all /api/ requests to backend.
    # Docker's embedded DNS + a variable upstream force nginx to re-resolve
    # the backend on every request — otherwise a backend rebuild changes the
    # container IP and the portal serves 502s until manually restarted.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }
}
