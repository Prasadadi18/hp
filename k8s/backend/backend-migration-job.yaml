apiVersion: batch/v1
kind: Job
metadata:
  name: backend-migration
  namespace: hpe
  labels:
    app: backend-migration
spec:
  template:
    metadata:
      labels:
        app: backend-migration
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "Waiting for PostgreSQL..."
              until nc -z postgres.hpe.svc.cluster.local 5432; do sleep 2; done
              echo "PostgreSQL is reachable"
      containers:
        - name: migration
          image: hpe-backend:latest
          imagePullPolicy: Never
          command: ["alembic", "upgrade", "head"]
          envFrom:
            - configMapRef:
                name: hpe-config
