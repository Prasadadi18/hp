apiVersion: v1
kind: ConfigMap
metadata:
  name: adminer-nginx-conf
  namespace: hpe
data:
  default.conf: |
    server {
        listen 8081;
        location / {
            proxy_pass http://127.0.0.1:8080;
            proxy_hide_header X-Frame-Options;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: adminer
  namespace: hpe
spec:
  replicas: 1
  selector:
    matchLabels:
      app: adminer
  template:
    metadata:
      labels:
        app: adminer
    spec:
      containers:
      - name: adminer
        image: adminer
        ports:
        - containerPort: 8080
        env:
        - name: ADMINER_DEFAULT_SERVER
          value: "postgres"
      - name: nginx-proxy
        image: nginx:alpine
        ports:
        - containerPort: 8081
        volumeMounts:
        - name: nginx-conf
          mountPath: /etc/nginx/conf.d/default.conf
          subPath: default.conf
      volumes:
      - name: nginx-conf
        configMap:
          name: adminer-nginx-conf
---
apiVersion: v1
kind: Service
metadata:
  name: adminer
  namespace: hpe
spec:
  type: ClusterIP
  selector:
    app: adminer
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8081
