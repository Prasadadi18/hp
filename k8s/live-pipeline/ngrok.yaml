apiVersion: v1
kind: ConfigMap
metadata:
  name: ngrok-config
  namespace: hpe
data:
  ngrok.yml: |
    authtoken: 3Evn80dJM1rjzjrYRHs0BJnkdTb_axURLohqXGb6DNK5YVGw
    version: "2"
    tunnels:
      hpe-portal:
        proto: http
        addr: login-portal:80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ngrok
  namespace: hpe
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ngrok
  template:
    metadata:
      labels:
        app: ngrok
    spec:
      containers:
      - name: ngrok
        image: ngrok/ngrok:latest
        command:
        - ngrok
        - start
        - --all
        - --config
        - /etc/ngrok.yml
        volumeMounts:
        - name: config-volume
          mountPath: /etc/ngrok.yml
          subPath: ngrok.yml
      volumes:
      - name: config-volume
        configMap:
          name: ngrok-config
